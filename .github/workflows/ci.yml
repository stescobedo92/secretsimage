name: CI

# Build + test on EVERY commit: any push to any branch and every pull request.
# Tagged releases are handled separately by release.yml (SemVer tags vX.Y.Z).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libx11-dev ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y tesseract ninja
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "SECRETSIMAGE_TESSERACT=C:\Program Files\Tesseract-OCR\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Unit tests and metrics gate
        run: ctest --test-dir build -L unit --output-on-failure

      - name: OCR end-to-end tests (real Tesseract)
        run: ctest --test-dir build -L ocr --output-on-failure

      - name: CLI smoke test
        shell: bash
        run: |
          if [ -f build/secretsimage.exe ]; then ./build/secretsimage.exe version; else ./build/secretsimage version; fi

      # Per-commit downloadable build (Actions > this run > Artifacts).
      # Stable, versioned downloads live in GitHub Releases (release.yml).
      - name: Upload per-commit build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretsimage-${{ matrix.artifact }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/secretsimage
            build/secretsimage.exe
            build/gen_synthetic
            build/gen_synthetic.exe
