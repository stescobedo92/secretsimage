name: Release

# SemVer releases: push a tag vMAJOR.MINOR.PATCH (for example v0.1.0) that
# matches the project version in CMakeLists.txt. The workflow verifies the
# match, builds and tests on all three OSes, then publishes checksummed
# archives to a GitHub Release.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify SemVer tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' is not SemVer (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          version="${tag#v}"
          cmake_version="$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)"
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::Tag version $version does not match CMakeLists.txt version $cmake_version"
            exit 1
          fi
          changelog_version="$(grep -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)"
          if [ "$version" != "$changelog_version" ]; then
            echo "::error::Tag version $version does not match latest CHANGELOG.md entry $changelog_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing secretsimage $version"

  build:
    name: Build ${{ matrix.os }}
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: windows-latest
            artifact: windows-x86_64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libx11-dev ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y tesseract ninja
          "SECRETSIMAGE_TESSERACT=C:\Program Files\Tesseract-OCR\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure, build and test
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build -L unit --output-on-failure
          ctest --test-dir build -L ocr --output-on-failure

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          stage="secretsimage-${VERSION}-${ARTIFACT}"
          mkdir -p "dist/${stage}"
          for exe in secretsimage gen_synthetic; do
            if [ -f "build/${exe}.exe" ]; then cp "build/${exe}.exe" "dist/${stage}/"; else cp "build/${exe}" "dist/${stage}/"; fi
          done
          cp LICENSE README.md CHANGELOG.md SECURITY.md "dist/${stage}/"
          cp -r docs "dist/${stage}/docs"
          mkdir -p "dist/${stage}/assets"
          cp assets/icon.png "dist/${stage}/assets/" 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="${stage}.zip"
            (cd dist && 7z a "${archive}" "${stage}")
          else
            archive="${stage}.tar.gz"
            (cd dist && tar -czf "${archive}" "${stage}")
          fi
          (cd dist && (sha256sum "${archive}" > "${archive}.sha256" 2>/dev/null || shasum -a 256 "${archive}" > "${archive}.sha256"))

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/secretsimage-*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: secretsimage ${{ needs.verify-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Download

            | Platform | Asset |
            |---|---|
            | Windows (x86_64) | `secretsimage-${{ needs.verify-version.outputs.version }}-windows-x86_64.zip` |
            | Linux (x86_64) | `secretsimage-${{ needs.verify-version.outputs.version }}-linux-x86_64.tar.gz` |
            | macOS (arm64) | `secretsimage-${{ needs.verify-version.outputs.version }}-macos-arm64.tar.gz` |

            Verify downloads with the matching `*.sha256` file.

            ## Requirements

            [Tesseract OCR](https://tesseract-ocr.github.io/) must be installed
            (`apt install tesseract-ocr`, `brew install tesseract`,
            `choco install tesseract`). It is found on `PATH` or in standard
            installer locations; set `SECRETSIMAGE_TESSERACT` for custom installs.

            ## Quick start

            ```sh
            secretsimage watch                       # redact clipboard screenshots before paste
            secretsimage redact shot.png -o shot.redacted.png
            secretsimage scan docs/images/*.png      # CI gate (exit 2 if secrets found)
            ```
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
